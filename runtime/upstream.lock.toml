schema = 1

[runtime]
repository = "https://github.com/deepseek-ai/deepseek-harness"
tag = "dsh-v0.2.1-rc.5"
version = "0.2.1-rc.5"
commit = "b830ec950faba0a46dda564be3e2d854afed94f1"
submodule = "runtime/upstream"

[runtime.build]
package_manager = "pnpm@11.28.5"
node = ">=24.9.0"
commands = [
    "pnpm install --frozen-lockfile",
    "pnpm run build",
]

[packaging]
runtime_entry = "apps/cli/lib/bin.js"
notes = [
    "Runtime is built from the pinned submodule; the client never downloads or updates DSH at startup.",
    "The bundled Node.js runtime and the built CLI are packaged in a later round; this round only prepares the build scripts.",
]
