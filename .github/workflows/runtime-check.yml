name: Runtime check

# Proves the pinned runtime still installs, builds and speaks the version this
# repository claims. Runs on demand and weekly so a pinned version cannot rot
# silently (for example when the upstream registry drops an old dependency).

on:
  workflow_dispatch:
  schedule:
    - cron: "43 5 * * 1"
  push:
    branches: [main]
    paths:
      - "runtime/upstream"
      - "runtime/host.mjs"
      - "runtime/upstream.lock.toml"
      - "runtime/protocol-source.lock"
      - "crates/dsh-protocol/**"
      - "crates/dsh-state/**"
      - "crates/dsh-tui/**"
      - ".github/workflows/runtime-check.yml"
      - "scripts/build-runtime.sh"
      - "scripts/smoke-runtime.sh"
      - "scripts/test-runtime-chat.py"
  pull_request:
    paths:
      - "runtime/**"
      - "crates/dsh-protocol/**"
      - "crates/dsh-state/**"
      - "crates/dsh-tui/**"
      - ".github/workflows/runtime-check.yml"
      - "scripts/build-runtime.sh"
      - "scripts/smoke-runtime.sh"
      - "scripts/test-runtime-chat.py"

permissions:
  contents: read

concurrency:
  group: runtime-check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build bundled runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v6
        with:
          version: "11.28.5"

      - name: Check out the pinned runtime commit
        run: git submodule update --init --depth 1 runtime/upstream

      - name: Pin still matches the submodule
        run: ./scripts/check-runtime-pin.sh

      - name: Build the runtime from the pinned commit
        run: ./scripts/build-runtime.sh

      - name: Bundled agent reports the pinned version
        run: ./scripts/smoke-runtime.sh

      - name: The TUI's protocol crate still matches the wire contract
        run: cargo run --quiet --locked -p dsh-protocol --bin dsh-runtime-lock -- contract

      - name: The TUI initializes and shuts down the official SDK runtime
        env:
          DEEPSEEK_API_KEY: keyless-smoke-no-call
          DEEPSEEK_BASE_URL: http://127.0.0.1:9
        run: cargo run --quiet --locked -p dsh-tui -- --check-runtime

      - name: Official SDK chat, tools and approvals in a terminal
        run: python3 scripts/test-runtime-chat.py
