name: Upstream sync

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Prepare and verify the upgrade branch without opening a PR"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: deepseek-ai/deepseek-harness
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  detect:
    name: detect new release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      updated: ${{ steps.select.outputs.updated }}
      current: ${{ steps.select.outputs.current }}
      tag: ${{ steps.select.outputs.tag }}
      version: ${{ steps.select.outputs.version }}
      prerelease: ${{ steps.select.outputs.prerelease }}
      release_url: ${{ steps.select.outputs.release_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: List published releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$UPSTREAM_REPO/releases?per_page=100" > "$RUNNER_TEMP/pages.json"
          jq '[.[][] | {tag_name, prerelease, draft, published_at, html_url}]' "$RUNNER_TEMP/pages.json" > "$RUNNER_TEMP/releases.json"
      - name: Compare against the pin
        id: select
        run: |
          set -euo pipefail
          cargo run --quiet --locked -p dsh-protocol --bin dsh-runtime-lock -- \
            select --releases "$RUNNER_TEMP/releases.json" | tee -a "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"

  prepare:
    name: prepare upgrade branch
    needs: detect
    if: needs.detect.outputs.updated == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      branch: ${{ steps.prepare.outputs.branch }}
      head: ${{ steps.prepare.outputs.head }}
      commit: ${{ steps.prepare.outputs.commit }}
      protocol_diff: ${{ steps.prepare.outputs.protocol_diff }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Resolve, update and verify the release pin
        id: prepare
        env:
          TAG: ${{ needs.detect.outputs.tag }}
          CURRENT: ${{ needs.detect.outputs.current }}
        run: |
          set -euo pipefail
          if [ "$(cargo run --quiet --locked -p dsh-protocol --bin dsh-runtime-lock -- show | awk '$1 == "tag" {print $2}')" != "$CURRENT" ]; then
            echo "The main pin changed after detection. Re-run detection before preparing an update." >&2
            exit 1
          fi
          previous=$(git rev-parse HEAD:runtime/upstream)
          branch="upstream/$TAG"
          git config user.name "lingxi-upstream-bot"
          git config user.email "upstream-bot@users.noreply.github.com"
          # Reuse the existing history so retries and maintainer fixes survive.
          if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            git switch --create "$branch" "origin/$branch"
            git merge --no-edit origin/main
          else
            git switch --create "$branch"
          fi
          git submodule update --init --depth 1 runtime/upstream
          git -C runtime/upstream fetch --depth 1 origin "refs/tags/$TAG:refs/tags/$TAG"
          commit=$(git -C runtime/upstream rev-parse "$TAG^{commit}")
          git -C runtime/upstream checkout --detach "$commit"
          cargo run --quiet --locked -p dsh-protocol --bin dsh-runtime-lock -- set --tag "$TAG" --commit "$commit"
          cargo metadata --format-version 1 > /dev/null
          ./scripts/check-runtime-pin.sh
          # Check the whole ordered patch series against the unmodified source.
          shopt -s nullglob
          patches=("$GITHUB_WORKSPACE"/patches/*.patch)
          if [ ${#patches[@]} -gt 0 ]; then
            git -C runtime/upstream apply --check "${patches[@]}"
          fi
          cargo run --quiet --locked -p dsh-protocol --bin dsh-runtime-lock -- contract
          git -C runtime/upstream fetch --depth 1 origin "$previous"
          diff=$(git -C runtime/upstream diff --stat "$previous" "$commit" -- packages/sdk apps/cli/src packages/session packages/llm)
          git add Cargo.toml Cargo.lock runtime/upstream.lock.toml runtime/upstream
          if ! git diff --cached --quiet; then
            git commit -m "chore(runtime): sync DSH ${TAG#dsh-}"
          fi
          git push origin "HEAD:refs/heads/$branch"
          {
            echo "branch=$branch"
            echo "head=$(git rev-parse HEAD)"
            echo "commit=$commit"
            echo "protocol_diff<<PROTOCOL_DIFF_EOF"
            echo "$diff"
            echo "PROTOCOL_DIFF_EOF"
          } >> "$GITHUB_OUTPUT"

  verify-rust:
    name: verify rust workspace
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.head }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: git submodule update --init --depth 1 runtime/upstream
      - name: Check the workspace and update guards
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets
          cargo build --workspace --locked
          ./target/debug/dsh-tui --version
          ./scripts/test-pin-guards.sh
          ./scripts/test-sync-merge.sh

  verify-runtime:
    name: verify bundled runtime
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.head }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6
        with:
          version: "11.28.5"
      - run: git submodule update --init --depth 1 runtime/upstream
      - run: ./scripts/build-runtime.sh
      - run: ./scripts/smoke-runtime.sh

  open-pr:
    name: open upgrade pull request
    needs: [detect, prepare, verify-rust, verify-runtime]
    if: |
      always() && needs.prepare.result == 'success'
      && (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
    outputs:
      number: ${{ steps.open.outputs.number }}
      blocked: ${{ steps.open.outputs.blocked }}
      ci_run: ${{ steps.open.outputs.ci_run }}
      runtime_run: ${{ steps.open.outputs.runtime_run }}
    steps:
      - name: Check App configuration
        id: app-config
        env:
          APP_ID: ${{ secrets.SYNC_APP_ID }}
          APP_KEY: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
        run: |
          if [[ ( -n "$APP_ID" && -z "$APP_KEY" ) || ( -z "$APP_ID" && -n "$APP_KEY" ) ]]; then
            echo "Configure both SYNC_APP_ID and SYNC_APP_PRIVATE_KEY, or neither." >&2
            exit 1
          fi
          if [ -n "$APP_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/create-github-app-token@v3
        id: app
        if: steps.app-config.outputs.configured == 'true'
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          permission-pull-requests: write
      - name: Open or refresh one PR and run its CI
        id: open
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          DISPATCH_TOKEN: ${{ github.token }}
          CURRENT: ${{ needs.detect.outputs.current }}
          TAG: ${{ needs.detect.outputs.tag }}
          VERSION: ${{ needs.detect.outputs.version }}
          PRERELEASE: ${{ needs.detect.outputs.prerelease }}
          RELEASE_URL: ${{ needs.detect.outputs.release_url }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          HEAD: ${{ needs.prepare.outputs.head }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
          PROTOCOL_DIFF: ${{ needs.prepare.outputs.protocol_diff }}
          RUST_RESULT: ${{ needs.verify-rust.result }}
          RUNTIME_RESULT: ${{ needs.verify-runtime.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          blocked=false
          if [ "$RUST_RESULT" != success ] || [ "$RUNTIME_RESULT" != success ]; then
            blocked=true
          fi
          GH_TOKEN="$DISPATCH_TOKEN" gh label create runtime-sync --repo "$GITHUB_REPOSITORY" --color 0e8a16 --force
          GH_TOKEN="$DISPATCH_TOKEN" gh label create runtime-sync/blocked --repo "$GITHUB_REPOSITORY" --color d93f0b --force
          gh api "repos/$UPSTREAM_REPO/releases/tags/$TAG" --jq '.body // "Release notes are empty."' > "$RUNNER_TEMP/release-notes.md"
          {
            echo "## Runtime update"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Current | \`$CURRENT\` |"
            echo "| Target | \`$TAG\` ($VERSION) |"
            echo "| Prerelease | $PRERELEASE |"
            echo "| Upstream commit | \`$COMMIT\` |"
            echo "| Verified client commit | \`$HEAD\` |"
            echo "| Official release | $RELEASE_URL |"
            echo
            echo "## Upstream release notes"
            echo
            cat "$RUNNER_TEMP/release-notes.md"
            echo
            echo "## Verification"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Branch merge and ordered patches | passed |"
            echo "| Reviewed SDK source and wire names | passed |"
            echo "| Rust build, lint and tests | $RUST_RESULT |"
            echo "| Runtime build and exact version smoke | $RUNTIME_RESULT |"
            echo
            echo "## Protocol and related source changes"
            echo
            echo '```text'
            echo "$PROTOCOL_DIFF"
            echo '```'
            echo
            echo "## Review risks"
            echo
            echo "- Real Agent process, imported domain types and streaming compatibility remain uncovered in round one."
            echo "- Review release notes for behavior changes affecting this client."
            echo "- Apply no-auto-merge, do-not-merge, breaking-change, major-risk, hold or blocked to require human handling."
            echo
            echo "Verification logs are available at $RUN_URL"
          } > "$RUNNER_TEMP/pr-body.md"
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state all --json number,state \
            --jq '[.[] | select(.state != "MERGED")][0].number // ""')
          if [ -n "$number" ]; then
            state=$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json state --jq .state)
            if [ "$state" = CLOSED ]; then
              gh pr reopen "$number" --repo "$GITHUB_REPOSITORY"
            fi
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --title "chore(runtime): sync DSH v$VERSION" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --title "chore(runtime): sync DSH v$VERSION" --body-file "$RUNNER_TEMP/pr-body.md" --label runtime-sync
            number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number')
          fi
          if [ "$blocked" = true ]; then
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --add-label runtime-sync/blocked
          else
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --remove-label runtime-sync/blocked
          fi
          # Explicit dispatch also works for builtin-token PRs and unchanged retries.
          dispatch() {
            GH_TOKEN="$DISPATCH_TOKEN" gh api -X POST \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$1/dispatches" \
              -f ref="$BRANCH" | jq -er '.workflow_run_id'
          }
          ci_run=$(dispatch ci.yml)
          runtime_run=$(dispatch runtime-check.yml)
          {
            echo "number=$number"
            echo "blocked=$blocked"
            echo "ci_run=$ci_run"
            echo "runtime_run=$runtime_run"
          } >> "$GITHUB_OUTPUT"

  auto-merge:
    name: auto-merge (gated)
    needs: [prepare, open-pr]
    if: vars.AUTO_MERGE_UPSTREAM == 'true' && needs.open-pr.outputs.blocked == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Run the merge policy from the same revision as this workflow.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Wait for CI and check the current PR before merging
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.open-pr.outputs.number }}
          EXPECTED_HEAD: ${{ needs.prepare.outputs.head }}
          CI_RUN: ${{ needs.open-pr.outputs.ci_run }}
          RUNTIME_RUN: ${{ needs.open-pr.outputs.runtime_run }}
        run: |
          set -euo pipefail
          # Check these dispatches, not stale results attached to the same SHA.
          for run in "$CI_RUN" "$RUNTIME_RUN"; do
            actual_head=$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)
            if [ "$actual_head" != "$EXPECTED_HEAD" ]; then
              echo "Run $run tested $actual_head, expected $EXPECTED_HEAD" >&2
              exit 1
            fi
            gh run watch "$run" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10
          done
          gh pr checks "$PR" --repo "$GITHUB_REPOSITORY" --watch --fail-fast --interval 10
          ./scripts/check-sync-merge.sh "$PR" "$EXPECTED_HEAD"
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$EXPECTED_HEAD"

  report-failure:
    name: record a failed sync
    needs: [detect, prepare, verify-rust, verify-runtime, open-pr, auto-merge]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      issues: write
    steps:
      - name: Maintain one issue with failed jobs and error excerpts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect.outputs.tag || 'release-detection' }}
          CURRENT: ${{ needs.detect.outputs.current }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          title="chore(runtime): sync DSH $TAG failed"
          gh label create runtime-sync/failed --repo "$GITHUB_REPOSITORY" --color b60205 --force
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure") | [.name, (.id | tostring), .html_url] | @tsv' > "$RUNNER_TEMP/failed-jobs.tsv"
          {
            echo "The sync for \`$TAG\` failed. Current pin at detection was \`$CURRENT\`."
            echo
            while IFS=$'\t' read -r name job_id url; do
              echo "### $name"
              echo
              echo "$url"
              echo
              echo '```text'
              if gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job_id/logs" > "$RUNNER_TEMP/job.log"; then
                tail -60 "$RUNNER_TEMP/job.log"
              else
                echo "Job logs are still being finalized. Follow the job link for error details."
              fi
              echo '```'
              echo
            done < "$RUNNER_TEMP/failed-jobs.tsv"
            echo "Workflow logs are available at $RUN_URL"
          } > "$RUNNER_TEMP/issue-body.md"
          gh issue list --repo "$GITHUB_REPOSITORY" --state all --label runtime-sync/failed --limit 1000 \
            --json number,title,state > "$RUNNER_TEMP/issues.json"
          existing=$(jq -r --arg title "$title" '[.[] | select(.title == $title)][0].number // ""' "$RUNNER_TEMP/issues.json")
          if [ -n "$existing" ]; then
            state=$(jq -r --argjson number "$existing" '.[] | select(.number == $number) | .state' "$RUNNER_TEMP/issues.json")
            if [ "$state" = CLOSED ]; then
              gh issue reopen "$existing" --repo "$GITHUB_REPOSITORY"
            fi
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/issue-body.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body-file "$RUNNER_TEMP/issue-body.md" --label runtime-sync/failed
          fi
